<!DOCTYPE html>
<html>
<head>
    <title>Downloaded Photos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 30px 20px;
        }

        h1 { margin-bottom: 8px; }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
        }

        .item {
            background: #2a2a2a;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            color: #ccc;
        }

        .empty {
            color: #888;
            margin: 40px 0;
            font-size: 18px;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            background: #333;
            color: white;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Downloaded Photos</h1>

    {% if downloaded %}
        <p class="subtitle">{{ downloaded|length }} photos saved to your downloads folder</p>
        <div class="list">
            {% for name in downloaded %}
                <div class="item">✓ {{ name }}</div>
            {% endfor %}
        </div>
    {% else %}
        <p class="empty">No photos downloaded this session.</p>
    {% endif %}

    <a href="/" class="btn">Back to Home</a>
</body>
</html>
